services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qrisgate
      POSTGRES_PASSWORD: qrisgate
      POSTGRES_DB: qrisgate
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qrisgate"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      ADDR: ":8080"
      DATABASE_URL: postgres://qrisgate:qrisgate@postgres:5432/qrisgate?sslmode=disable
      REDIS_ADDR: redis:6379
      ADMIN_TOKEN: dev-admin-token
      METRICS_ADDR: ":9090"
    ports:
      - "8080:8080"
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
